<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador RA - DRA Ica</title>
    
    <!-- Librerías que garantizan que la cámara encienda correctamente -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <!-- Precarga de la imagen -->
        <a-assets>
            <img id="imagen-mapa" src="recurso.jpeg">
        </a-assets>

        <!-- Marcador Hiro predeterminado -->
        <a-marker preset="hiro">
            <a-plane position="0 0 0" rotation="-90 0 0" width="1.5" height="1.5" src="#imagen-mapa"></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
