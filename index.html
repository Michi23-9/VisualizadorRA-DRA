<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador RA - DRA Ica</title>
    
    <!-- Librerías estables de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Precargador de assets para asegurar que la imagen cargue correctamente -->
        <a-assets>
            <img id="imagen-mapa" src="recurso.jpeg">
        </a-assets>

        <!-- Luz ambiental para iluminar el plano -->
        <a-light type="ambient" color="#FFF"></a-light>

        <!-- Marcador Hiro predeterminado -->
        <a-marker preset="hiro">
            <!-- Plano vinculado al asset precargado -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="1.5" height="1.5" src="#imagen-mapa"></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
