<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- Configuración para adaptar la vista a diferentes tamaños de pantalla en móviles y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prueba AR.js - HIRO con Animación</title>

    <!-- Importación de la librería A-Frame (Versión 1.3.0 para máxima estabilidad con AR.js) -->
    <script src="https://aframe.io"></script>

    <!-- Importación de la librería AR.js compatible -->
    <script src="https://githack.com"></script>
</head>

<!-- Estilo para quitar márgenes y ocultar las barras de desplazamiento, haciendo que la cámara ocupe toda la pantalla -->
<body style="margin: 0; overflow: hidden;">

    <!-- Contenedor principal de la escena de Realidad Aumentada -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- ================================================= -->
        <!-- CONFIGURACIÓN DEL MARCADOR -->
        <!-- ================================================= -->
        <!-- 
          preset="hiro": Busca el marcador Hiro.
          smooth="true": Suaviza el movimiento del objeto 3D.
        -->
        <a-marker preset="hiro" smooth="true">

            <!-- ================================================= -->
            <!-- OBJETO VIRTUAL 3D (Cubo Verde Animado) -->
            <!-- ================================================= -->
            <!-- 
              color="#2ECC71": Tu color verde esmeralda original.
              position="0 0.5 0": Elevado sobre el papel.
              scale="0.5 0.5 0.5": Tamaño equilibrado.
              animation: Añade un giro constante de 0 a 360 grados en el eje Y cada 6 segundos (6000ms).
            -->
            <a-box 
                position="0 0.5 0" 
                scale="0.5 0.5 0.5" 
                color="#2ECC71"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
            </a-box>

        </a-marker>

        <!-- ================================================= -->
        <!-- CÁMARA VIRTUAL -->
        <!-- ================================================= -->
        

    </a-scene>

</body>

</html>
