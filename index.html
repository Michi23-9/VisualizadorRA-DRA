```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Visualizador RA - DRA Ica</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .a-canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam;">

        <!-- MARCADOR PERSONALIZADO DE LA DRA -->
        <a-marker
            type="pattern"
            url="marker.patt">

            <!-- OBJETO DE PRUEBA -->
            <a-box
                position="0 0.5 0"
                color="green"
                rotation="0 45 0"
                animation="property: rotation;
                           to: 0 405 0;
                           loop: true;
                           dur: 3000">
            </a-box>

        </a-marker>

        <!-- CÁMARA -->
        <a-entity camera></a-entity>

    </a-scene>

</body>

</html>
```
