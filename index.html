<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capas NDVI, NDRE, LCI en AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <!-- Estilos CSS para los botones flotantes -->
    <style>
        .menu-capas {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            gap: 10px;
        }
        .menu-capas button {
            background-color: #2ECC71;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- Botones en pantalla para alternar las capas -->
    <div class="menu-capas">
        <button onclick="cambiarCapa('img/mapa_ndvi.jpg')">NDVI</button>
        <button onclick="cambiarCapa('img/mapa_ndre.jpg')">NDRE</button>
        <button onclick="cambiarCapa('img/mapa_lci.jpg')">LCI</button>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- Marcador Hiro -->
        <a-marker preset="hiro" smooth="true">

            <!-- Plano 3D para el mapa -->
            <a-plane 
                id="planoMapa"
                src="img/mapa_ndvi.jpg" 
                position="0 0 0" 
                rotation="-90 0 0" 
                width="2" 
                height="2">
            </a-plane>

        </a-marker>

        <!-- Cámara -->
        <a-entity camera></a-entity>

    </a-scene>

    <!-- Script para cambiar la imagen -->
    <script>
        function cambiarCapa(rutaImagen) {
            const plano = document.querySelector('#planoMapa');
            plano.setAttribute('src', rutaImagen);
        }
    </script>

</body>

</html>
