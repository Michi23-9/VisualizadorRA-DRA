<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador RA - DRA Ica</title>
    
    <!-- Usar CDN oficiales y estables de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
    </style>
</head>
<body>

    <!-- Escena optimizada de AR.js -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <!-- Precargador de assets -->
        <a-assets>
            <img id="imagen-mapa" src="recurso.jpeg">
        </a-assets>

        <!-- Marcador Hiro predeterminado -->
        <a-marker preset="hiro">
            <a-plane position="0 0 0" rotation="-90 0 0" width="1.5" height="1.5" src="#imagen-mapa"></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
