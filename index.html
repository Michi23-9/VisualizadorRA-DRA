
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Prueba Cámara DRA Ica</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <video id="camera" autoplay playsinline muted></video>

    <script>
        const video = document.getElementById("camera");

        navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            },
            audio: false
        })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(error => {
            document.body.innerHTML =
                "<p style='color:white;font-size:20px;padding:20px'>" +
                "Error de cámara: " + error.name + "<br>" +
                error.message +
                "</p>";
        });
    </script>

</body>

</html>
