<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador RA - DRA Ica</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Usamos tu archivo marcador.patt que generaste para el logo de la DRA Ica -->
        <a-marker type="pattern" url="marcador.patt">
            <!-- Plano verde/imagen de prueba que aparecerá sobre tu logo -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="1" height="1" src="recurso.jpeg" color="#00FF00"></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
