<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador RA - DRA Ica</title>
    
    <!-- Librerías de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Escena con soporte forzado de cámara trasera (environment) -->
    <a-scene embedded arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;">
        
        <!-- Tu marcador personalizado -->
        <a-marker type="pattern" url="marcador.patt">
            <a-plane position="0 0 0" rotation="-90 0 0" width="1" height="1" src="recurso.jpeg"></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
