<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador RA - DRA Ica</title>
    
    <!-- Librerías de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Asegura que el contenedor de video de la cámara no quede oculto */
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            color: white;
            font-family: sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de carga mientras activa la cámara -->
    <div class="arjs-loader">
        <div>Cargando cámara, por favor permita el acceso...</div>
    </div>

    <!-- Escena de Realidad Aumentada -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <!-- Tu marcador personalizado -->
        <a-marker type="pattern" url="marcador.patt">
            <a-plane position="0 0 0" rotation="-90 0 0" width="1" height="1" src="recurso.jpeg"></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Ocultar el mensaje de carga cuando la escena inicie
        document.querySelector('a-scene').addEventListener('loaded', function () {
            const loader = document.querySelector('.arjs-loader');
            if (loader) loader.style.display = 'none';
        });
    </script>
</body>
</html>
