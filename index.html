<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- Configuración indispensable para pantallas móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <title>Realidad Aumentada Completa - Cámara + Cubo Verde</title>

    <!-- 1. Librería Base 3D (A-Frame v1.3.0) -->
    <script src="https://aframe.io"></script>

    <!-- 2. Extensión de Realidad Aumentada (AR.js) que maneja la Webcam y los Marcadores -->
    <script src="https://githack.com"></script>
</head>

<!-- Estilos obligatorios para que el video de la cámara ocupe el 100% de la pantalla sin cortes -->
<body style="margin: 0px; overflow: hidden; font-family: sans-serif;">

    <!-- Texto de ayuda flotante que desaparecerá cuando la cámara encienda -->
    <div style="position: fixed; top: 10px; width:100%; text-align: center; z-index: 1; color: white; background: rgba(0,0,0,0.6); padding: 5px 0;">
        Acepta los permisos de cámara y apunta al marcador HIRO
    </div>

    <!-- 
      [ESCENA AR]: Aquí se inicializa la cámara web.
      - embedded: Ajusta la escena al contenedor de la página.
      - arjs="sourceType: webcam;": ACTIVA LA CÁMARA de tu teléfono o PC en tiempo real.
      - debugUIEnabled: false: Oculta cuadros de texto innecesarios de la librería.
    -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- 
          [EL MARCADOR]: El "ancla" en el mundo real. 
          Cuando la cámara web detecte el patrón negro de "HIRO", dibujará lo que esté aquí dentro.
        -->
        <a-marker preset="hiro" smooth="true">

            <!-- 
              [EL OBJETO 3D]: Tu cubo verde personalizado.
              - animation: Hace que gire 360 grados en el eje vertical de forma infinita.
            -->
            <a-box 
                position="0 0.5 0" 
                scale="0.5 0.5 0.5" 
                color="#2ECC71"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
            </a-box>

        </a-marker>

        <!-- 
          [LA CÁMARA VIRTUAL]: Obligatoria. 
          Le dice a A-Frame que renderice los objetos 3D desde la perspectiva exacta de tu cámara real.
        -->
        

    </a-scene>

</body>

</html>
