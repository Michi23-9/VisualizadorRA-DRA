<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador RA - DRA Ica</title>
    
    <!-- Incluir A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Escena de Realidad Aumentada -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <!-- Definir el marcador personalizado apuntando a tu archivo .patt -->
        <a-marker type="pattern" url="marcador.patt">
            
            <!-- Elemento que aparecerá sobre el marcador: en este caso, un plano con tu recurso.jpeg -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="1" height="1" src="recurso.jpeg"></a-plane>
            
        </a-marker>

        <!-- Cámara de la escena -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
