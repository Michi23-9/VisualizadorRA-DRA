<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Visualizador RA - DRA-ICA (prueba)</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #aviso {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.65); color: #fff; font-family: sans-serif;
      padding: 8px 16px; border-radius: 20px; font-size: 14px;
      z-index: 10; pointer-events: none; transition: opacity .3s;
    }
  </style>
</head>
<body>
  <div id="aviso">Apunta la cámara al marcador DRA-ICA</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; alpha: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono; maxDetectionRate: 30;">

    <a-assets>
      <img id="logo" src="recurso.jpeg" crossorigin="anonymous">
    </a-assets>

    <a-marker type="pattern" url="marcador.patt" smooth="true" smoothCount="10" id="marcador">

      <!-- Luz para que se vean los volúmenes -->
      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>

      <!-- Tu imagen flotando y girando (doble cara) -->
      <a-entity position="0 1 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        <a-plane src="#logo" width="1.5" height="1.5" material="side: double; transparent: true"></a-plane>
      </a-entity>

      <!-- Cubo y esfera para comprobar el 3D -->
      <a-box position="-0.9 0.25 0" width="0.5" height="0.5" depth="0.5" color="#8DC63F"
             animation="property: rotation; to: 0 360 360; loop: true; dur: 6000; easing: linear"></a-box>
      <a-sphere position="0.9 0.3 0" radius="0.3" color="#00AEEF"></a-sphere>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marcador = document.getElementById('marcador');
    const aviso = document.getElementById('aviso');
    marcador.addEventListener('markerFound', () => aviso.style.opacity = 0);
    marcador.addEventListener('markerLost',  () => aviso.style.opacity = 1);
  </script>
</body>
</html>
